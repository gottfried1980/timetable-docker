<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%" role="img" aria-label="Timetable Display: family calendar on your TV, hosted on your NAS">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="50%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#0d1117" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1f6feb" />
      <stop offset="100%" stop-color="#2dd4bf" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#1f6feb" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#10161d" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#30363d" stroke-width="1" stroke-opacity="0.3"/>
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2dd4bf" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bgGrad)" />
  <rect width="1200" height="400" fill="url(#grid)" />
  <circle cx="960" cy="190" r="250" fill="url(#glowGrad)" filter="url(#glow)" opacity="0.35" />
  <circle cx="150" cy="100" r="180" fill="url(#glowGrad)" filter="url(#glow)" opacity="0.15" />

  <!-- Right: TV with weekly calendar, NAS and TimeTree sync -->
  <g transform="translate(770, 50)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">

    <!-- Connections -->
    <line x1="-60" y1="56" x2="-60" y2="168" stroke="url(#accent)" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow)" />
    <text x="-50" y="118" font-size="10" fill="#8b949e" font-weight="600">every 15 min</text>
    <line x1="-10" y1="204" x2="40" y2="204" stroke="url(#accent)" stroke-width="2" />
    <line x1="-10" y1="212" x2="40" y2="212" stroke="#30363d" stroke-width="2" stroke-dasharray="4 4" />

    <!-- TimeTree node -->
    <g transform="translate(-115, 20)">
      <rect x="0" y="0" width="110" height="36" rx="8" fill="#21262d" stroke="#30363d" stroke-width="1.5"/>
      <circle cx="20" cy="18" r="4" fill="#3fb950" />
      <text x="34" y="23" font-size="13" fill="#8b949e" font-weight="600">TimeTree</text>
    </g>

    <!-- NAS node -->
    <g transform="translate(-110, 172)">
      <rect x="0" y="0" width="100" height="64" rx="8" fill="#21262d" stroke="#30363d" stroke-width="1.5"/>
      <rect x="12" y="12" width="76" height="14" rx="3" fill="#161b22" stroke="#30363d" />
      <rect x="12" y="32" width="76" height="14" rx="3" fill="#161b22" stroke="#30363d" />
      <circle cx="20" cy="19" r="2.5" fill="#3fb950" />
      <circle cx="20" cy="39" r="2.5" fill="#58a6ff" />
      <rect x="30" y="17" width="48" height="4" rx="2" fill="#30363d" />
      <rect x="30" y="37" width="48" height="4" rx="2" fill="#30363d" />
      <text x="50" y="80" font-size="11" fill="#8b949e" font-weight="600" text-anchor="middle">NAS · Docker</text>
    </g>

    <!-- TV frame -->
    <rect x="40" y="30" width="380" height="230" rx="14" fill="#161b22" stroke="#30363d" stroke-width="3"/>
    <rect x="52" y="42" width="356" height="206" rx="8" fill="url(#screenGrad)" />
    <rect x="200" y="262" width="60" height="10" rx="3" fill="#30363d" />
    <rect x="170" y="272" width="120" height="6" rx="3" fill="#21262d" />

    <!-- Screen: month header -->
    <text x="66" y="66" font-size="13" fill="#e6edf3" font-weight="700">Oktober 2026</text>
    <text x="164" y="66" font-size="11" fill="#8b949e">KW 42</text>

    <!-- Reminder toast -->
    <g transform="translate(254, 50)">
      <rect x="0" y="0" width="146" height="26" rx="6" fill="#1f6feb" fill-opacity="0.18" stroke="#58a6ff" stroke-opacity="0.7" filter="url(#softGlow)"/>
      <circle cx="13" cy="13" r="4" fill="#58a6ff" />
      <text x="24" y="17" font-size="10.5" fill="#cfe4ff" font-weight="600">in 15 min · Zahnarzt</text>
    </g>

    <!-- Weekday labels -->
    <g font-size="10" fill="#8b949e" font-weight="600" text-anchor="middle">
      <text x="86" y="92">Mo</text>
      <text x="135" y="92">Di</text>
      <text x="184" y="92" fill="#d29922">Mi</text>
      <text x="233" y="92">Do</text>
      <text x="282" y="92">Fr</text>
      <text x="331" y="92">Sa</text>
      <text x="380" y="92">So</text>
    </g>

    <!-- Day cells -->
    <g fill="#161b22" stroke="#21262d" stroke-width="1">
      <rect x="64" y="100" width="45" height="66" rx="5"/>
      <rect x="113" y="100" width="45" height="66" rx="5"/>
      <rect x="162" y="100" width="45" height="66" rx="5" fill="#d29922" fill-opacity="0.14" stroke="#d29922" stroke-opacity="0.8"/>
      <rect x="211" y="100" width="45" height="66" rx="5"/>
      <rect x="260" y="100" width="45" height="66" rx="5"/>
      <rect x="309" y="100" width="45" height="66" rx="5"/>
      <rect x="358" y="100" width="45" height="66" rx="5"/>
      <rect x="64" y="172" width="45" height="66" rx="5"/>
      <rect x="113" y="172" width="45" height="66" rx="5"/>
      <rect x="162" y="172" width="45" height="66" rx="5"/>
      <rect x="211" y="172" width="45" height="66" rx="5"/>
      <rect x="260" y="172" width="45" height="66" rx="5"/>
      <rect x="309" y="172" width="45" height="66" rx="5"/>
      <rect x="358" y="172" width="45" height="66" rx="5"/>
    </g>

    <!-- Day numbers -->
    <g font-size="9" fill="#6e7681" font-weight="600">
      <text x="69" y="111">12</text>
      <text x="118" y="111">13</text>
      <text x="167" y="111" fill="#d29922">14</text>
      <text x="216" y="111">15</text>
      <text x="265" y="111">16</text>
      <text x="314" y="111">17</text>
      <text x="363" y="111">18</text>
      <text x="69" y="183">19</text>
      <text x="118" y="183">20</text>
      <text x="167" y="183">21</text>
      <text x="216" y="183">22</text>
      <text x="265" y="183">23</text>
      <text x="314" y="183">24</text>
      <text x="363" y="183">25</text>
    </g>

    <!-- Event bars -->
    <g>
      <rect x="68" y="118" width="37" height="9" rx="3" fill="#58a6ff" />
      <rect x="68" y="131" width="26" height="9" rx="3" fill="#3fb950" />
      <rect x="117" y="118" width="37" height="9" rx="3" fill="#d2a8ff" />
      <rect x="166" y="118" width="37" height="9" rx="3" fill="#ff7b72" />
      <rect x="166" y="131" width="37" height="9" rx="3" fill="#58a6ff" />
      <rect x="166" y="144" width="22" height="9" rx="3" fill="#2dd4bf" />
      <rect x="215" y="118" width="30" height="9" rx="3" fill="#3fb950" />
      <rect x="264" y="118" width="37" height="9" rx="3" fill="#58a6ff" />
      <rect x="264" y="131" width="37" height="9" rx="3" fill="#d29922" />
      <rect x="313" y="118" width="86" height="9" rx="3" fill="#d2a8ff" />
      <rect x="68" y="190" width="37" height="9" rx="3" fill="#2dd4bf" />
      <rect x="117" y="190" width="37" height="9" rx="3" fill="#58a6ff" />
      <rect x="117" y="203" width="20" height="9" rx="3" fill="#ff7b72" />
      <rect x="215" y="190" width="37" height="9" rx="3" fill="#3fb950" />
      <rect x="264" y="190" width="37" height="9" rx="3" fill="#d2a8ff" />
      <rect x="313" y="190" width="37" height="9" rx="3" fill="#58a6ff" />
      <rect x="362" y="190" width="37" height="9" rx="3" fill="#d29922" />
    </g>
  </g>

  <!-- Left: title, subtitle, badges -->
  <g transform="translate(80, 0)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif">
    <!-- Calendar icon decor -->
    <g opacity="0.45">
      <rect x="0" y="118" width="38" height="34" rx="6" fill="none" stroke="#58a6ff" stroke-width="2.5"/>
      <rect x="0" y="118" width="38" height="10" rx="3" fill="#58a6ff"/>
      <rect x="7" y="134" width="7" height="6" rx="1.5" fill="#58a6ff"/>
      <rect x="16" y="134" width="7" height="6" rx="1.5" fill="#58a6ff"/>
      <rect x="25" y="134" width="7" height="6" rx="1.5" fill="#2dd4bf"/>
    </g>

    <text x="0" y="200" font-size="44" font-weight="800" fill="#ffffff" letter-spacing="-1">Timetable Display</text>
    <text x="0" y="255" font-size="44" font-weight="800" fill="url(#accent)" letter-spacing="-1">Family calendar on TV</text>

    <text x="0" y="305" font-size="18" fill="#8b949e" font-weight="400">NAS-hosted dashboard with TimeTree sync, tasks and reminders.</text>

    <g transform="translate(0, 340)" font-size="11" font-weight="600" text-anchor="middle">
      <rect x="0" y="0" width="110" height="24" rx="4" fill="#21262d" stroke="#30363d" />
      <text x="55" y="16" fill="#8b949e">Docker Compose</text>

      <rect x="120" y="0" width="48" height="24" rx="4" fill="#21262d" stroke="#30363d" />
      <text x="144" y="16" fill="#8b949e">MIT</text>

      <rect x="178" y="0" width="100" height="24" rx="4" fill="#1f6feb" fill-opacity="0.1" stroke="#388bfd" stroke-opacity="0.4" />
      <text x="228" y="16" fill="#58a6ff">TimeTree sync</text>

      <rect x="288" y="0" width="118" height="24" rx="4" fill="#2dd4bf" fill-opacity="0.1" stroke="#2dd4bf" stroke-opacity="0.4" />
      <text x="347" y="16" fill="#2dd4bf">Local, no cloud</text>
    </g>
  </g>
</svg>
